name: Deploy Rimini

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E and Timezone tests
        env:
          TZ: Asia/Tokyo
        run: npm run test:time

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/RinSecretary # Update to exact project path on VPS
            git pull origin main

            # Create data directories with appropriate permissions (assuming container user uid: 1001)
            mkdir -p data/uploads
            chown -R 1001:1001 data/

            # Dynamically generate .env file
            echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" > .env
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env

            # DB Backup if exists
            if [ -f data/sqlite.db ]; then
              curl -H "Content-Type: multipart/form-data" \
                   -F "file=@data/sqlite.db" \
                   -F "content=Daily SQLite Backup" \
                   ${{ secrets.ADMIN_DISCORD_WEBHOOK }} || true
            fi

            # Start services
            docker compose pull
            docker compose up -d

            # Notify Discord
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content":"🚀 Rimini: Next.js deployment completed successfully!"}' \
                 ${{ secrets.ADMIN_DISCORD_WEBHOOK }}
